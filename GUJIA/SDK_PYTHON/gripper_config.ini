# 夹爪编码器端点映射（独立文件；servo_config.ini 保持不变）
#
# 摇操里的夹爪不使用“中点原点”，而是按下面两个端点做线性映射：
#   closed_raw —— 夹爪完全闭合时编码器的原始值
#   open_raw   —— 夹爪完全张开时编码器的原始值
# 约定：正限位=张开，负限位=闭合。
#
# target_closed / target_open —— 下发到夹爪电机的 MIT 位置目标(rad)，
# 若张开/闭合方向相反，把这两个值互换即可。
#
# 留空或两端相同的夹爪会退回旧的 abs(角度)/9 归一化。

[left]
# 左夹爪（ID8）端点请按实测填写
# closed_raw =
# open_raw =
target_closed = -0.15
target_open = 1.1

[right]
# 右夹爪（ID16）：正限位=张开最大，负限位=完全闭合
closed_raw = 836
open_raw = 652
target_closed = -0.15
target_open = 1.1
